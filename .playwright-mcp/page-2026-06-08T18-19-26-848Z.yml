          - generic [ref=e878]:
            - link "CaliCoastReplay" [ref=e879] [cursor=pointer]:
              - /url: /user/CaliCoastReplay
            - text: ", 2016-11-16"
            - text: Well said, that I understand fully. I've often thought ShaderToy (or shaders in general) could advance even further with a really definitive shader desktop app, one that can actually do thinks ST can't easily - introduce custom textures and meshes, and do a lot of vertex work. I can only imagine how brilliant some of the best shaders on here could be if integrated with mesh tools, user textures, et cetera.
        - generic [ref=e880]:
          - img [ref=e882]
          - generic [ref=e883]:
            - link "valentingalea" [ref=e884] [cursor=pointer]:
              - /url: /user/valentingalea
            - text: ", 2016-11-16"
            - text: "@CaliCoastReplay you are right, let me rephrase: originally I wanted to say there is no place for this shader in AAA because of it's over-reliance on (actually exclusively) ALU work: raymarching, noise functions, normals calculations etc. One of the main reasons for these is because of Shadertoy and its principles and limitations. The shader itself, its underlying principles of generating waves, mixing in nice colours and reflections, can be isolated, extracted and redone within other systems. With all that said, TDM's work still stands on its own and continues to inspire and awe countless people - like the guy I mentioned in my original comment"
            - img [ref=e885]
        - generic [ref=e886]:
          - img [ref=e888]
          - generic [ref=e889]:
            - link "CaliCoastReplay" [ref=e890] [cursor=pointer]:
              - /url: /user/CaliCoastReplay
            - text: ", 2016-11-16"
            - text: So - "there is no room for an effect this heavy in a AAA title", but "nothing here [is] so crucial that [it] cannot be replicated"? I'm a bit unclear as to what you are trying to say, to put it mildly.
        - generic [ref=e891]:
          - img [ref=e893]
          - generic [ref=e894]:
            - link "valentingalea" [ref=e895] [cursor=pointer]:
              - /url: /user/valentingalea
            - text: ", 2016-11-14"
            - text: "@CaliCoastReplay you are overthinking it"
            - img [ref=e896]
            - text: without detracting TDM's effort there is nothing here so crucial that cannot be replicated, just excellent detail work
        - generic [ref=e897]:
          - img [ref=e899]
          - generic [ref=e900]:
            - link "CaliCoastReplay" [ref=e901] [cursor=pointer]:
              - /url: /user/CaliCoastReplay
            - text: ", 2016-11-14"
            - text: I would guess that one of the reasons this water is so good is that it *doesn't* use vertex animation. Meshes and vertices produce inaccuracy in the modeling, in much the same way that an MP3 is lossy when it comes to sound - because instead of modeling the actual position of the wave height at any given point between vertices, you're approximating it...now of course with modern shaders you can (and need to) do a lot better than simple lerps, and model actual curves, but even in the best of AAA titles these days I can still usually see a vertex transition that isn't curved well enough if I'm really looking. But there are many reasons this shader excels - excellent specular reflections, great color choices, and also in particular noise modeling that accurately simulates real ocean surfaces. I don't know that one would be able to translate this model well to a mesh-based approach somehow - but I don't know that one wouldn't, either. Perhaps TDM would have an opinion?
        - generic [ref=e902]:
