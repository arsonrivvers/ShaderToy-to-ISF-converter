name: TrueISFEditor
options:
  bundleIdPrefix: com.arsonrivvers
  deploymentTarget:
    macOS: "13.0"
packages:
  ShadertoyISFKit:
    path: ../ShadertoyISFKit
targets:
  TrueISFEditor:
    type: application
    platform: macOS
    sources:
      - path: TrueISFEditor
      - path: TrueISFEditor/Resources
        buildPhase: resources
      # Bundled sample gallery (repo /samples, folder reference → Resources/samples/*.fs).
      - path: ../samples
        buildPhase: resources
        type: folder
      # Bundled starter templates (repo /templates, folder reference → Resources/templates/*.fs).
      - path: ../templates
        buildPhase: resources
        type: folder
    dependencies:
      - package: ShadertoyISFKit
      - framework: ../vendor/prebuilt/ISFMSLKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/VVMetalKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINCache.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINOperation.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arsonrivvers.TrueISFEditor
        INFOPLIST_FILE: TrueISFEditor/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrueISFEditor/TrueISFEditor.entitlements
        # Apple Development (free personal team): stable code identity so TCC grants survive
        # rebuilds — ad-hoc ("-") minted a new identity every build and re-prompted every restage.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q9DY8S68BC
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        GENERATE_INFOPLIST_FILE: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../vendor/prebuilt
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        SWIFT_OBJC_BRIDGING_HEADER: TrueISFEditor/TrueISFEditor-Bridging-Header.h
      configs:
        # Debug: hardened runtime OFF. With ad-hoc signing it was silently disabled anyway
        # (Xcode note: "Disabling hardened runtime with ad-hoc codesigning"); with the real
        # identity, library validation would reject the ad-hoc-signed dylibs nested in the
        # vendored ISFMSLKit and abort the test host. Release keeps it for future notarization.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
  TrueISFEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TrueISFEditorTests
      - path: TrueISFEditor/Resources/symbols.json
        buildPhase: resources
      - TrueISFEditor/TestHarness.swift
      - TrueISFEditor/FetchStrategy.swift
      - TrueISFEditor/WebKitShaderFetcher.swift
      - TrueISFEditor/Models/ISFFile.swift
      - TrueISFEditor/Models/LibraryModel.swift
      - TrueISFEditor/PreviewEngine.swift
      - TrueISFEditor/PreviewCoordinator.swift
      - TrueISFEditor/RenderStats.swift
      - TrueISFEditor/ISFPreviewInput.swift
      - TrueISFEditor/CrashEvent.swift
      - TrueISFEditor/BoundedArray.swift
      - TrueISFEditor/CrashLog.swift
      - TrueISFEditor/MetalPreviewController.swift
      - TrueISFEditor/MetalRenderCore.swift
      - TrueISFEditor/RenderClock.swift
      - TrueISFEditor/DisplayLinkDriver.swift
      - TrueISFEditor/WebKitPreviewController.swift
      - TrueISFEditor/ISFMSLSafeBridge.mm
      - TrueISFEditor/FramePixelStats.swift
      - TrueISFEditor/PixelGate.swift
      - TrueISFEditor/GateInputPattern.swift
      - TrueISFEditor/DiagnosticsModel.swift
      - TrueISFEditor/CodeEditorView.swift
      - TrueISFEditor/ShaderAssist/AssistProvider.swift
      - TrueISFEditor/ShaderAssist/AssistProviderFactory.swift
      - TrueISFEditor/ShaderAssist/ClaudeCodeRunner.swift
      - TrueISFEditor/ShaderAssist/CodexRunner.swift
      - TrueISFEditor/ShaderAssist/SkillPreamble.swift
      - TrueISFEditor/ShaderAssist/AssistTranscriptFormatter.swift
      - TrueISFEditor/Acknowledgements.swift
      - TrueISFEditor/ShaderAssist/ShaderAssistViewModel.swift
      - TrueISFEditor/Views/AssistProgressStrip.swift
      - TrueISFEditor/Remix/RemixNode.swift
      - TrueISFEditor/Remix/RemixDirectives.swift
      - TrueISFEditor/Remix/RemixPrompt.swift
      - TrueISFEditor/Remix/RemixResponseParser.swift
      - TrueISFEditor/Remix/RemixGenerator.swift
      - TrueISFEditor/Remix/RemixLineage.swift
      - TrueISFEditor/Remix/RemixStudioModel.swift
      - TrueISFEditor/Remix/RemixParentResolver.swift
      - TrueISFEditor/Remix/RemixTreeBuilder.swift
      - TrueISFEditor/Remix/RemixCrossoverSettings.swift
      - TrueISFEditor/Remix/TextureSnapshot.swift
      - TrueISFEditor/Remix/RemixWorkspaceState.swift
      - TrueISFEditor/Remix/RemixSplitLayout.swift
      - TrueISFEditor/Remix/RemixSession.swift
      - TrueISFEditor/Remix/RemixSessionStore.swift
      - TrueISFEditor/Remix/RemixActivity.swift
      - TrueISFEditor/Remix/RemixParentLoadState.swift
      - TrueISFEditor/ImageSource.swift
      - TrueISFEditor/HeaderAuthoringModel.swift
      - TrueISFEditor/ISFSceneSource.swift
      - TrueISFEditor/CameraSource.swift
      - TrueISFEditor/SourceRouter.swift
      - TrueISFEditor/BlitFit.swift
    dependencies:
      - target: TrueISFEditor
      - package: ShadertoyISFKit
      - framework: ../vendor/prebuilt/ISFMSLKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/VVMetalKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINCache.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINOperation.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arsonrivvers.TrueISFEditorTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TrueISFEditor.app/Contents/MacOS/TrueISFEditor"
        BUNDLE_LOADER: "$(TEST_HOST)"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../vendor/prebuilt
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @loader_path/../Frameworks $(SRCROOT)/../vendor/prebuilt
        SWIFT_OBJC_BRIDGING_HEADER: TrueISFEditor/TrueISFEditor-Bridging-Header.h
schemes:
  TrueISFEditor:
    build:
      targets:
        TrueISFEditor: all
        TrueISFEditorTests: [test]
    test:
      targets: [TrueISFEditorTests]
