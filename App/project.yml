name: TrueISFEditor
options:
  bundleIdPrefix: com.arsonrivvers
  deploymentTarget:
    macOS: "13.0"
packages:
  ShadertoyISFKit:
    path: ../ShadertoyISFKit
targets:
  TrueISFEditor:
    type: application
    platform: macOS
    sources:
      - path: TrueISFEditor
      - path: TrueISFEditor/Resources
        buildPhase: resources
    dependencies:
      - package: ShadertoyISFKit
      - framework: ../vendor/prebuilt/ISFMSLKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/VVMetalKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINCache.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINOperation.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arsonrivvers.TrueISFEditor
        INFOPLIST_FILE: TrueISFEditor/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrueISFEditor/TrueISFEditor.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        GENERATE_INFOPLIST_FILE: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../vendor/prebuilt
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        SWIFT_OBJC_BRIDGING_HEADER: TrueISFEditor/TrueISFEditor-Bridging-Header.h
  TrueISFEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TrueISFEditorTests
      - path: TrueISFEditor/Resources/symbols.json
        buildPhase: resources
      - TrueISFEditor/FetchStrategy.swift
      - TrueISFEditor/WebKitShaderFetcher.swift
      - TrueISFEditor/Models/ISFFile.swift
      - TrueISFEditor/Models/LibraryModel.swift
      - TrueISFEditor/PreviewEngine.swift
      - TrueISFEditor/PreviewCoordinator.swift
      - TrueISFEditor/ISFPreviewInput.swift
      - TrueISFEditor/CrashEvent.swift
      - TrueISFEditor/CrashLog.swift
      - TrueISFEditor/MetalPreviewController.swift
      - TrueISFEditor/WebKitPreviewController.swift
      - TrueISFEditor/ISFMSLSafeBridge.mm
      - TrueISFEditor/DiagnosticsModel.swift
      - TrueISFEditor/CodeEditorView.swift
      - TrueISFEditor/ShaderAssist/AssistProvider.swift
      - TrueISFEditor/ShaderAssist/ClaudeCodeRunner.swift
      - TrueISFEditor/ShaderAssist/CodexRunner.swift
      - TrueISFEditor/ShaderAssist/SkillPreamble.swift
      - TrueISFEditor/ShaderAssist/ShaderAssistViewModel.swift
      - TrueISFEditor/Remix/RemixNode.swift
      - TrueISFEditor/Remix/RemixDirectives.swift
      - TrueISFEditor/Remix/RemixPrompt.swift
      - TrueISFEditor/ImageSource.swift
      - TrueISFEditor/HeaderAuthoringModel.swift
      - TrueISFEditor/ISFSceneSource.swift
      - TrueISFEditor/CameraSource.swift
      - TrueISFEditor/SourceRouter.swift
      - TrueISFEditor/BlitFit.swift
    dependencies:
      - package: ShadertoyISFKit
      - framework: ../vendor/prebuilt/ISFMSLKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/VVMetalKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINCache.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINOperation.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arsonrivvers.TrueISFEditorTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../vendor/prebuilt
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @loader_path/../Frameworks $(SRCROOT)/../vendor/prebuilt
        SWIFT_OBJC_BRIDGING_HEADER: TrueISFEditor/TrueISFEditor-Bridging-Header.h
schemes:
  TrueISFEditor:
    build:
      targets:
        TrueISFEditor: all
        TrueISFEditorTests: [test]
    test:
      targets: [TrueISFEditorTests]
