name: TrueISFEditor
options:
  bundleIdPrefix: com.arsonrivvers
  deploymentTarget:
    macOS: "13.0"
packages:
  ShadertoyISFKit:
    path: ../ShadertoyISFKit
targets:
  TrueISFEditor:
    type: application
    platform: macOS
    sources:
      # Shared ISF render runtime, compiled into every app target that renders ISF.
      - path: ISFRuntime
      - path: TrueISFEditor
      - path: TrueISFEditor/Resources
        buildPhase: resources
      # Bundled sample gallery (repo /samples, folder reference → Resources/samples/*.fs).
      - path: ../samples
        buildPhase: resources
        type: folder
      # Bundled starter templates (repo /templates, folder reference → Resources/templates/*.fs).
      - path: ../templates
        buildPhase: resources
        type: folder
    dependencies:
      - package: ShadertoyISFKit
      - framework: ../vendor/prebuilt/ISFMSLKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/VVMetalKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINCache.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINOperation.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arsonrivvers.TrueISFEditor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: TrueISFEditor/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrueISFEditor/TrueISFEditor.entitlements
        # Apple Development (free personal team): stable code identity so TCC grants survive
        # rebuilds — ad-hoc ("-") minted a new identity every build and re-prompted every restage.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q9DY8S68BC
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        GENERATE_INFOPLIST_FILE: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../vendor/prebuilt
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        SWIFT_OBJC_BRIDGING_HEADER: TrueISFEditor/TrueISFEditor-Bridging-Header.h
        # The bridging header's quoted #imports resolve across both directories now that
        # ISFMSLSafeBridge.h lives in ISFRuntime and CrashWriter.h stays with the editor.
        USER_HEADER_SEARCH_PATHS: $(SRCROOT)/ISFRuntime $(SRCROOT)/TrueISFEditor
      configs:
        # Debug: hardened runtime OFF. With ad-hoc signing it was silently disabled anyway
        # (Xcode note: "Disabling hardened runtime with ad-hoc codesigning"); with the real
        # identity, library validation would reject the ad-hoc-signed dylibs nested in the
        # vendored ISFMSLKit and abort the test host. Release keeps it for future notarization.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
  TrueISFEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TrueISFEditorTests
      - path: TrueISFEditor/Resources/symbols.json
        buildPhase: resources
      - TrueISFEditor/FetchStrategy.swift
      - TrueISFEditor/WebKitShaderFetcher.swift
      # The shared runtime, compiled into the test bundle exactly as its individual files were
      # before the extraction. ParamStore is EXCLUDED deliberately: it was never in this list, and
      # ParamStoreTests reaches it through `@testable import TrueISFEditor` (see the comment in
      # that file). Sweeping it in here would mint a second, distinct ParamStore type.
      - path: ISFRuntime
        excludes:
          - "ParamStore.swift"
      - TrueISFEditor/Models/ISFFile.swift
      - TrueISFEditor/PreviewEngine.swift
      - TrueISFEditor/PreviewCoordinator.swift
      - TrueISFEditor/CrashEvent.swift
      - TrueISFEditor/BoundedArray.swift
      - TrueISFEditor/CrashLog.swift
      - TrueISFEditor/MetalPreviewController.swift
      - TrueISFEditor/WebKitPreviewController.swift
      - TrueISFEditor/CaptureInputPlan.swift
      - TrueISFEditor/DiagnosticsModel.swift
      - TrueISFEditor/CodeEditorView.swift
      - TrueISFEditor/ShaderAssist/AssistProvider.swift
      - TrueISFEditor/ShaderAssist/AssistRunEvent.swift
      - TrueISFEditor/ShaderAssist/AssistResponseAssembler.swift
      - TrueISFEditor/ShaderAssist/AssistProviderCompatibilityAdapter.swift
      - TrueISFEditor/ShaderAssist/AssistProviderFactory.swift
      - TrueISFEditor/ShaderAssist/ClaudeCodeRunner.swift
      - TrueISFEditor/ShaderAssist/CodexRunner.swift
      - TrueISFEditor/ShaderAssist/SkillPreamble.swift
      - TrueISFEditor/ShaderAssist/AssistTranscriptFormatter.swift
      - TrueISFEditor/Acknowledgements.swift
      - TrueISFEditor/ShaderAssist/ShaderAssistViewModel.swift
      - TrueISFEditor/Views/AssistProgressStrip.swift
      - path: TrueISFEditorTests/Fixtures/claude-empty-result-complete-assistant.jsonl
        buildPhase: resources
      - path: TrueISFEditorTests/Fixtures/remix-2026-08-01-empty-result-session-v1.json
        buildPhase: resources
      - path: TrueISFEditorTests/Fixtures/remix-schema-v2-mid-batch.json
        buildPhase: resources
      - TrueISFEditor/Remix/RemixNode.swift
      - TrueISFEditor/Remix/RemixChildRunRecord.swift
      - TrueISFEditor/Remix/LegacyRemixSessionV1.swift
      - TrueISFEditor/Remix/RemixDirectives.swift
      - TrueISFEditor/Remix/RemixPrompt.swift
      - TrueISFEditor/Remix/RemixResponseParser.swift
      - TrueISFEditor/Remix/RemixLegacyRecovery.swift
      - TrueISFEditor/Remix/RemixCompiler.swift
      - TrueISFEditor/Remix/RemixBatchRunController.swift
      - TrueISFEditor/Remix/RemixGenerator.swift
      - TrueISFEditor/Remix/RemixLineage.swift
      - TrueISFEditor/Remix/RemixStudioModel.swift
      - TrueISFEditor/Remix/RemixParentResolver.swift
      - TrueISFEditor/Remix/RemixTreeBuilder.swift
      - TrueISFEditor/Remix/RemixCrossoverSettings.swift
      - TrueISFEditor/Remix/TextureSnapshot.swift
      - TrueISFEditor/Remix/RemixWorkspaceState.swift
      - TrueISFEditor/Remix/RemixSplitLayout.swift
      - TrueISFEditor/Remix/RemixSession.swift
      - TrueISFEditor/Remix/RemixSessionStore.swift
      - TrueISFEditor/Remix/RemixActivity.swift
      - TrueISFEditor/Remix/RemixPreviewState.swift
      - TrueISFEditor/Remix/RemixParentLoadState.swift
      - TrueISFEditor/Remix/RemixBreedingBayPresentation.swift
      - TrueISFEditor/Remix/RemixComparisonCoordinator.swift
      - TrueISFEditor/Remix/RemixLineagePresentation.swift
      - TrueISFEditor/HeaderAuthoringModel.swift
    dependencies:
      - target: TrueISFEditor
      - package: ShadertoyISFKit
      - framework: ../vendor/prebuilt/ISFMSLKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/VVMetalKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINCache.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINOperation.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arsonrivvers.TrueISFEditorTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TrueISFEditor.app/Contents/MacOS/TrueISFEditor"
        BUNDLE_LOADER: "$(TEST_HOST)"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../vendor/prebuilt
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @loader_path/../Frameworks $(SRCROOT)/../vendor/prebuilt
        SWIFT_OBJC_BRIDGING_HEADER: TrueISFEditor/TrueISFEditor-Bridging-Header.h
        USER_HEADER_SEARCH_PATHS: $(SRCROOT)/ISFRuntime $(SRCROOT)/TrueISFEditor
  ARShader:
    type: application
    platform: macOS
    sources:
      - path: ISFRuntime
      - path: ARShader
    dependencies:
      - package: ShadertoyISFKit
      - framework: ../vendor/prebuilt/ISFMSLKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/VVMetalKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINCache.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINOperation.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arsonrivvers.ARShader
        INFOPLIST_FILE: ARShader/Info.plist
        CODE_SIGN_ENTITLEMENTS: ARShader/ARShader.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q9DY8S68BC
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        GENERATE_INFOPLIST_FILE: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../vendor/prebuilt
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        SWIFT_OBJC_BRIDGING_HEADER: ARShader/ARShader-Bridging-Header.h
        USER_HEADER_SEARCH_PATHS: $(SRCROOT)/ISFRuntime $(SRCROOT)/ARShader
      configs:
        # Same rationale as the editor: with the real signing identity, library validation would
        # reject the ad-hoc-signed dylibs nested in the vendored ISFMSLKit and abort the test host.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
  ARShaderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ARShaderTests
      - path: ARShaderTests/Fixtures
        buildPhase: resources
        type: folder
      # Committed layout baselines. The tests read these from the SOURCE tree via `#filePath`
      # (see SurfaceRenderHarness.baselinesDirectory), so this entry is for visibility in Xcode
      # rather than for lookup — recording must write the copy that gets committed.
      - path: ARShaderTests/Baselines
        buildPhase: resources
        type: folder
      - path: ISFRuntime
      - path: ARShader
        excludes:
          - "ARShaderApp.swift"   # a second @main in the test bundle is a duplicate entry point
    dependencies:
      - target: ARShader
      - package: ShadertoyISFKit
      - framework: ../vendor/prebuilt/ISFMSLKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/VVMetalKit.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINCache.framework
        embed: true
        codeSign: true
      - framework: ../vendor/prebuilt/PINOperation.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arsonrivvers.ARShaderTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ARShader.app/Contents/MacOS/ARShader"
        BUNDLE_LOADER: "$(TEST_HOST)"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../vendor/prebuilt
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @loader_path/../Frameworks $(SRCROOT)/../vendor/prebuilt
        SWIFT_OBJC_BRIDGING_HEADER: ARShader/ARShader-Bridging-Header.h
        USER_HEADER_SEARCH_PATHS: $(SRCROOT)/ISFRuntime $(SRCROOT)/ARShader
schemes:
  TrueISFEditor:
    build:
      targets:
        TrueISFEditor: all
        TrueISFEditorTests: [test]
    test:
      targets: [TrueISFEditorTests]
      environmentVariables:
        - variable: RUN_NATIVE_REMIX_COMPILER
          value: "${RUN_NATIVE_REMIX_COMPILER}"
  ARShader:
    build:
      targets:
        ARShader: all
        ARShaderTests: [test]
    test:
      targets: [ARShaderTests]
