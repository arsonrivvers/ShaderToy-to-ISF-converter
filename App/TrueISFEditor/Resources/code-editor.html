<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body, #root { margin: 0; height: 100%; background: #282c34; }
  .cm-editor { height: 100%; font-size: 13px; }
  .cm-scroller { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<div id="root"></div>
<script src="cm.bundle.js"></script>
<script>
(function () {
  var view = null;
  // Echo guard: when Swift pushes text via setText, suppress the resulting change post.
  var suppressNextChange = false;

  function post(o) {
    if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.editor) {
      webkit.messageHandlers.editor.postMessage(o);
    } else {
      console.info("CM_POST " + JSON.stringify(o));
    }
  }

  window.initEditor = function (doc) {
    view = window.__createEditor(document.getElementById("root"), doc || "", function (text) {
      if (suppressNextChange) { suppressNextChange = false; return; }
      post({ type: "change", text: text });
    });
  };

  // Replace the whole document (used when opening a file / external update).
  window.setText = function (text) {
    if (!view) return;
    if (text === view.state.doc.toString()) return;
    suppressNextChange = true;
    view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: text } });
  };

  // diags: [{ line, message, severity }] — 1-based line numbers.
  window.setDiagnostics = function (diags) {
    if (!view) return;
    var mapped = (diags || []).map(function (d) {
      var lineNo = Math.max(1, Math.min(d.line || 1, view.state.doc.lines));
      var ln = view.state.doc.line(lineNo);
      return { from: ln.from, to: ln.to, severity: d.severity || "error", message: d.message || "" };
    });
    view.dispatch(window.__cmSetDiagnostics(view.state, mapped));
  };

  // Move the cursor to a 1-based line and scroll it into view (click-to-jump from a diagnostic).
  window.revealLine = function (line) {
    if (!view) return;
    var lineNo = Math.max(1, Math.min(line, view.state.doc.lines));
    var info = view.state.doc.line(lineNo);
    view.dispatch({ selection: { anchor: info.from }, scrollIntoView: true });
    view.focus();
  };

  // Replace 1-based lines [fromLine..toLine] with `replacement`. The normal change handler
  // fires -> Swift onChange -> recompile. CodeMirror history makes it undoable.
  window.applyTextEdit = function (fromLine, toLine, replacement) {
    if (!view) return;
    var doc = view.state.doc;
    var from = doc.line(Math.max(1, Math.min(fromLine, doc.lines))).from;
    var to = doc.line(Math.max(1, Math.min(toLine, doc.lines))).to;
    view.dispatch({ changes: { from: from, to: to, insert: replacement } });
  };

  // Populate the symbol DB used by the hover tooltip (pushed from Swift after init).
  window.setSymbols = function (arr) {
    var map = {};
    (arr || []).forEach(function (s) { map[s.name] = s; });
    window.__symbols = map;
  };

  // The shader's declared input names, pushed from Swift on each compile/header change, so
  // autocomplete offers the shader's own uniforms.
  window.__inputNames = [];
  window.setInputNames = function (arr) { window.__inputNames = arr || []; };

  post({ type: "ready" });
})();
</script>
</body>
</html>
